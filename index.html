<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ST国試トレーナー</title>
<meta name="theme-color" content="#ff7aa8">
<meta name="description" content="言語聴覚士国家試験の過去問・予想問題を解いて学べる学習アプリ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ST国試">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
/* =========================================================
   見た目（色を変えたいときは :root の値だけ変えればOK）
   ========================================================= */
:root{
  --bg:#fff8f1; --card:#ffffff; --ink:#4a3b45; --mute:#9a8a93; --line:#f1e3e8;
  --pink:#ff7aa8; --pink-l:#ffe3ee; --mint:#3cc7a8; --mint-l:#dcf7ef;
  --yellow:#ffc94d; --yellow-l:#fff3d1; --lav:#a98bff; --lav-l:#eee7ff;
  --red:#ff6b6b; --red-l:#ffe5e5; --blue:#5aa9ff; --blue-l:#e2f0ff;
  --r:18px; --sh:0 6px 0 rgba(74,59,69,.08), 0 10px 24px rgba(74,59,69,.08);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Maru Gothic ProN","Rounded Mplus 1c","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
  -webkit-text-size-adjust:100%}
body{background-image:radial-gradient(var(--pink-l) 1.5px,transparent 1.5px),radial-gradient(var(--mint-l) 1.5px,transparent 1.5px);
  background-size:28px 28px;background-position:0 0,14px 14px}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,select{font:inherit}
header{position:sticky;top:0;z-index:30;padding-top:env(safe-area-inset-top);background:rgba(255,248,241,.92);backdrop-filter:blur(8px);border-bottom:2px dashed var(--line)}
.hwrap{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:10px 14px}
.logo{font-weight:900;font-size:1.05rem;letter-spacing:.02em;white-space:nowrap}
.logo b{color:var(--pink)}.logo i{font-style:normal;color:var(--mint)}
nav{display:flex;gap:4px;margin-left:auto;overflow-x:auto}
nav button{padding:7px 11px;border-radius:999px;font-weight:700;font-size:.85rem;white-space:nowrap}
nav button.on{background:var(--pink);color:#fff;box-shadow:0 3px 0 #e05c8b}
.iconbtn{width:36px;height:36px;border-radius:50%;background:var(--card);box-shadow:var(--sh);flex:none}
main{max-width:860px;margin:0 auto;padding:16px 14px 170px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin-bottom:16px;border:2px solid var(--line)}
h2{font-size:1.15rem;margin:0 0 12px}h3{font-size:1rem;margin:16px 0 8px}
.mute{color:var(--mute);font-size:.85rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 18px;border-radius:14px;font-weight:800;
  background:var(--pink);color:#fff;box-shadow:0 5px 0 #e05c8b;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #e05c8b}
.btn.mint{background:var(--mint);box-shadow:0 5px 0 #2aa58a}.btn.mint:active{box-shadow:0 2px 0 #2aa58a}
.btn.lav{background:var(--lav);box-shadow:0 5px 0 #8a6be6}.btn.lav:active{box-shadow:0 2px 0 #8a6be6}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 5px 0 var(--line);border:2px solid var(--line)}
.btn.big{width:100%;padding:16px;font-size:1.05rem}
.btn[disabled]{opacity:.45;pointer-events:none}
.seg{display:flex;background:var(--pink-l);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:9px 6px;border-radius:10px;font-weight:800;font-size:.9rem}
.seg button.on{background:#fff;color:var(--pink);box-shadow:0 2px 0 rgba(0,0,0,.06)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 11px;border-radius:999px;border:2px solid var(--line);background:#fff;font-size:.82rem;font-weight:700}
.chip.on{background:var(--mint-l);border-color:var(--mint);color:#1f8f76}
.chip[disabled]{opacity:.35}
.dom{border:2px solid var(--line);border-radius:14px;margin-bottom:8px;overflow:hidden}
.dom summary{list-style:none;display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;font-weight:800;font-size:.9rem}
.dom summary::-webkit-details-marker{display:none}
.dom .subs{padding:4px 12px 12px}
.cb{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:inline-grid;place-items:center;flex:none;background:#fff;font-size:.8rem}
.cb.on{background:var(--mint);border-color:var(--mint);color:#fff}.cb.part{background:var(--mint-l);border-color:var(--mint)}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.72rem;font-weight:800;background:var(--blue-l);color:#2f7fd6}
.badge.ai{background:var(--lav-l);color:#7a5ae0}.badge.rv{background:var(--yellow-l);color:#b07a00}.badge.dm{background:var(--mint-l);color:#1f8f76}
/* クイズ */
.qtop{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.prog{flex:1;height:12px;background:#fff;border-radius:99px;border:2px solid var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--yellow));border-radius:99px;transition:width .3s}
.combo{font-weight:900;color:#ff8a3d;white-space:nowrap}
.combo.hot{animation:pulse .6s infinite alternate}
.stem{font-size:1.02rem;line-height:1.75;font-weight:700;margin:10px 0 12px;white-space:pre-wrap}
.items{background:var(--yellow-l);border-radius:12px;padding:10px 14px;margin-bottom:12px;line-height:1.7;font-size:.95rem}
.qimg{max-width:100%;border-radius:12px;border:2px solid var(--line);margin:6px 0;background:#fff}
.choices{display:flex;flex-direction:column;gap:9px}
.choice{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:13px 14px;border-radius:14px;border:2px solid var(--line);
  background:#fff;font-weight:700;line-height:1.55;box-shadow:0 4px 0 var(--line);transition:transform .08s,background .15s}
.choice:active{transform:translateY(2px)}
.choice .no{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--pink-l);color:var(--pink);font-weight:900}
.choice.sel{border-color:var(--pink);background:var(--pink-l)}
.choice.ok{border-color:var(--mint);background:var(--mint-l)}.choice.ok .no{background:var(--mint);color:#fff}
.choice.ng{border-color:var(--red);background:var(--red-l)}.choice.ng .no{background:var(--red);color:#fff}
.choice.off{opacity:.35;text-decoration:line-through}
.choice[disabled]{pointer-events:none}
.tfcard{background:linear-gradient(135deg,var(--lav-l),var(--blue-l));border-radius:16px;padding:18px;font-size:1.1rem;font-weight:800;line-height:1.7;text-align:center;margin:8px 0 14px}
.tfask{text-align:center;font-weight:800;color:var(--mute);margin-bottom:10px}
.tfbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tfbtn{font-size:2.6rem;font-weight:900;padding:14px 0;border-radius:18px;background:#fff;border:3px solid var(--line);box-shadow:0 5px 0 var(--line)}
.tfbtn.o{color:var(--mint)}.tfbtn.x{color:var(--red)}
.tfbtn.ok{background:var(--mint-l);border-color:var(--mint)}.tfbtn.ng{background:var(--red-l);border-color:var(--red)}
.tfbtn[disabled]{pointer-events:none}
.fb{margin-top:14px;border-radius:var(--r);padding:16px;border:2px solid}
.fb.ok{background:var(--mint-l);border-color:var(--mint)}.fb.ng{background:var(--red-l);border-color:var(--red)}
.verdict{font-size:1.25rem;font-weight:900;margin-bottom:10px}
.explain{display:flex;gap:10px;align-items:flex-start;margin:10px 0}
.explain .av{width:70px;flex:none}
.explain .sp{flex:1;background:#fff;border-radius:16px;padding:12px 14px;position:relative;line-height:1.75;font-size:.93rem;border:2px solid var(--line)}
.explain .sp:before{content:"";position:absolute;left:-10px;top:20px;border:8px solid transparent;border-right-color:#fff}
.tname{font-weight:900;font-size:.82rem;color:var(--lav);margin-bottom:4px}
details.more{background:#fff;border-radius:12px;padding:10px 12px;margin-top:8px;border:2px solid var(--line)}
details.more summary{font-weight:800;cursor:pointer;font-size:.9rem}
.ce{padding:6px 0;border-bottom:1px dashed var(--line);font-size:.88rem;line-height:1.65}.ce:last-child{border:none}
.ce b.ok{color:var(--mint)}
/* キャラ */
.av img,.slot img,.gal img,.hero img{width:100%;height:auto;display:block;filter:drop-shadow(0 3px 3px rgba(0,0,0,.12))}
.emoji{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:var(--yellow-l);font-size:2rem;border:3px solid #fff;box-shadow:var(--sh)}
#stage{position:fixed;left:0;right:0;bottom:0;z-index:40;pointer-events:none;display:flex;justify-content:space-between;padding:0 6px calc(6px + env(safe-area-inset-bottom))}
.slot{width:min(130px,26vw);opacity:0;transform:translateY(40px) scale(.9);transition:all .35s cubic-bezier(.2,1.4,.4,1);position:relative}
.slot.show{opacity:1;transform:none}
.slot.show img,.slot.show .emoji{animation:hop .6s ease}
.bub{position:absolute;bottom:92%;background:#fff;border:2.5px solid var(--ink);border-radius:16px;padding:8px 11px;font-size:.82rem;font-weight:800;
  line-height:1.45;width:max-content;max-width:min(230px,58vw);box-shadow:0 4px 0 rgba(0,0,0,.08)}
.slot.L .bub{left:8px}.slot.R .bub{right:8px}
.bub:after{content:"";position:absolute;bottom:-11px;border:7px solid transparent;border-top-color:var(--ink)}
.slot.L .bub:after{left:22px}.slot.R .bub:after{right:22px}
.hero{display:flex;gap:12px;align-items:flex-end}.hero .av{width:110px;flex:none}
.hero .sp{flex:1;background:var(--pink-l);border-radius:18px;padding:14px;font-weight:800;line-height:1.6}
/* 成績 */
.stat{background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:1.5rem;color:var(--pink)}.stat span{font-size:.78rem;color:var(--mute);font-weight:700}
.bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;border-radius:99px}
.drow{padding:8px 0;border-bottom:1px dashed var(--line);font-size:.88rem}
table{width:100%;border-collapse:collapse;font-size:.85rem}td,th{padding:7px 6px;border-bottom:1px dashed var(--line);text-align:left}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.gal .g{background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px;font-size:.72rem;text-align:center}
.gal .g.err{border-color:var(--red)}
.field{display:flex;flex-direction:column;gap:4px;font-weight:800;font-size:.85rem;flex:1;min-width:140px}
.field input{padding:11px 12px;border-radius:12px;border:2px solid var(--line);background:#fff}
.install{background:var(--mint-l);border:2px solid var(--mint);border-radius:var(--r);padding:14px;margin-bottom:16px;font-size:.88rem;line-height:1.7}
.install h3{margin:0 0 6px;font-size:.98rem}.install ol{margin:4px 0 6px;padding-left:1.4em}
.install .x{float:right;font-size:.8rem;color:var(--mute);text-decoration:underline}
.netbar{background:var(--ink);color:#fff;text-align:center;font-size:.78rem;padding:4px 8px;display:none}
body.offline .netbar{display:block}
textarea.code{width:100%;min-height:90px;font:inherit;font-size:.75rem;padding:8px;border:2px solid var(--line);border-radius:12px;word-break:break-all}
.notice{background:var(--yellow-l);border-radius:12px;padding:10px 12px;font-size:.85rem;line-height:1.6;margin:8px 0}
pre.preview{background:#fff;border:2px dashed var(--line);border-radius:12px;padding:10px;font-size:.78rem;white-space:pre-wrap;max-height:180px;overflow:auto}
.big-score{font-size:3rem;font-weight:900;color:var(--pink);text-align:center;line-height:1}
/* エフェクト */
.spark{position:fixed;z-index:60;pointer-events:none;font-size:18px;animation:spark .9s ease-out forwards}
.confetti{position:fixed;top:-20px;z-index:60;width:10px;height:14px;border-radius:3px;pointer-events:none;animation:fall 2.4s linear forwards}
.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.shake{animation:shake .4s}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes hop{0%{transform:translateY(0)}30%{transform:translateY(-16px)}60%{transform:translateY(0)}80%{transform:translateY(-5px)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes pulse{to{transform:scale(1.15)}}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.3) rotate(180deg);opacity:0}}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(720deg)}}
@media (max-width:520px){main{padding:12px 10px 160px}.card{padding:14px}.logo{font-size:.92rem}nav button{padding:6px 8px;font-size:.78rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="netbar">📴 オフライン中：問題は解けます（提出は電波のある場所で）</div><div class="hwrap">
  <div class="logo"><b>ST</b>国試<i>トレーナー</i></div>
  <nav id="nav">
    <button data-v="home">ホーム</button><button data-v="setup">出題</button>
    <button data-v="stats">成績</button><button data-v="settings">設定</button>
  </nav>
  <button class="iconbtn" id="mute" title="効果音"></button>
</div></header>
<main id="app"></main>
<div id="stage"><div class="slot L" id="slotL"></div><div class="slot R" id="slotR"></div></div>

<!-- 問題バンク（同じフォルダの bank.js）。無い場合はデモ問題で動きます -->
<script src="bank.js" onerror="console.info('bank.js が見つからないためデモ問題で起動します')"></script>
<!-- 学校ごとの提出先（同じフォルダの school.js）。無い場合は提出ボタンが使えない状態で起動します -->
<script>
/* 提出先の読み込み：URLの末尾に ?s=学校コード があれば schools/学校コード.js を、無ければ school.js を読む
   例）…/st-kokushi/?s=yanagawa → schools/yanagawa.js */
(function(){
  var m = location.search.match(/[?&]s=([A-Za-z0-9_-]+)/);
  var src = m ? 'schools/' + m[1].toLowerCase() + '.js' : 'school.js';
  document.write('<script src="' + src + '" onerror="console.info(\'提出先ファイルが見つかりません：' + src + '\')"><\/script>');
})();
</script>

<script>
/* =====================================================================
   ★★★ 設定エリア（ここだけ触れば運用できます） ★★★
   ===================================================================== */

/* ---------- ① キャラクター画像 ----------
   ・画像は、このHTMLと同じ場所の「chara」フォルダに入れます。
   ・役割と状態は「ファイル名」から自動で読み取ります。
       形式：  役割の名前＋番号_状態.webp      例） student1_happy-idea.webp（学生キャラ1_happy-idea.webp も可）
       ※ スマホ公開（GitHub）で確実に表示するため、配布版は英数字のファイル名にしています
       ・役割：ファイル名に含まれる語で判定
           「学生」→学生　「解説」→解説　「アニマル」または「動物」→アニマルサポート　「サポート」→人間サポート
       ・状態：「_」のあとに英単語で。複数は「-」でつなぐ
           normal=通常 think=悩み idea=ひらめき happy=正解で喜ぶ sad=不正解で落ち込む combo=連続正解
           cheer=応援 praise=褒める hint=ヒント explain=解説
   ・キャラを追加・差し替えるときは、画像を chara に入れて、下の一覧に1行足す（または書き換える）だけ。
     name は吹き出しや解説に出る名前、topics に書いた語が問題の分野名に含まれると、そのキャラが優先して登場します。 */
const CHARA_DIR = 'chara/';
const CHARACTERS = [
  // ---- 学生（9：うち8・9は不正解時の泣き顔）----
  { file:'student1_happy-idea.webp',        name:'ひより' },
  { file:'student2_normal.webp',            name:'りく' },
  { file:'student3_happy-combo.webp',       name:'みお',  topics:['聴覚','音響'] },
  { file:'student4_normal-think.webp',  name:'ことね', topics:['聴覚','聴力','補聴'] },
  { file:'student5_happy.webp',             name:'そうた', topics:['聴覚','聴力','補聴','人工内耳'] },
  { file:'student6_normal-think.webp',  name:'ゆな',  topics:['言語発達','小児'] },
  { file:'student7_combo-happy.webp',       name:'はると' },
  { file:'student8_sad.webp',               name:'ゆな',  topics:['言語発達','小児'] },  // ゆな（6）の泣き顔
  { file:'student9_sad.webp',               name:'りく' },                              // りく（2）の泣き顔
  // ---- 解説（4）----
  { file:'teacher1_explain.webp',  name:'ハカセ' },
  { file:'teacher2_explain.webp',  name:'まなぶ先生' },
  { file:'teacher3_explain.webp',  name:'ひらめき先生' },
  { file:'teacher4_explain.webp',  name:'しおり先生' },
  // ---- 人間サポート（5）----
  { file:'support1_cheer.webp',      name:'はな先輩', topics:['嚥下','摂食'] },
  { file:'support2_hint.webp',       name:'るる先輩' },
  { file:'support3_hint.webp',       name:'みけ先輩', topics:['嚥下','摂食'] },
  { file:'support4_cheer-hint.webp', name:'かい先輩' },
  { file:'support5_cheer.webp',      name:'なつ先輩' },
  // ---- アニマルサポート（4）----
  { file:'animal1_praise.webp',      name:'レッサーパンダのパン', topics:['音響','音声'] },
  { file:'animal2_praise-hint.webp', name:'うさぎのミミ' },
  { file:'animal3_cheer.webp',       name:'くまのモコ' },
  { file:'animal4_praise.webp',      name:'ねこのスプーン', topics:['嚥下','摂食'] },
];

/* ファイル名の語 → 役割・状態の対応表（上から順に判定。「アニマルサポート」はアニマルが先に当たる） */
const ROLE_WORDS = [
  ['animal',  ['animal','アニマル','動物']],
  ['support', ['support','サポート','先輩']],
  ['teacher', ['teacher','解説']],
  ['student', ['student','学生']],
];
const MOOD_WORDS = {
  normal:['normal','通常'], think:['think','悩み'], idea:['idea','ひらめき'], happy:['happy','joy','正解'],
  sad:['sad','落ち込み'], combo:['combo','連続'], cheer:['cheer','応援'], praise:['praise','褒め'],
  hint:['hint','ヒント'], explain:['explain','解説'],
};

/* どの場面で、どの役割・状態のキャラを出すか（L=左、R=右） */
const CAST = {
  start   :{ L:['student',['normal']],        R:['support',['cheer']] },
  correct :{ L:['student',['happy']],         R:['animal',['praise']] },
  combo   :{ L:['student',['combo','happy']], R:['animal',['praise','cheer']] },
  recover :{ L:['student',['idea']],          R:['animal',['praise']] },
  wrong   :{ L:['student',['sad']],   R:['support',['cheer','hint']] },
  hint    :{                                  R:['support',['hint']] },
  weak    :{ L:['student',['think']],         R:['support',['cheer']] },
  conquer :{ L:['student',['idea','happy']],  R:['animal',['praise']] },
  finishHi:{ L:['student',['combo','happy']], R:['animal',['praise']] },
  finishMd:{ L:['student',['normal']],        R:['support',['cheer']] },
  finishLo:{ L:['student',['think','sad']],   R:['support',['cheer','hint']] },
};
/* セリフ（{n}=コンボ数、{rate}=正答率 に置き換わります） */
const LINES = {
  start   :{ student:['よーし、やるぞ！','今日もがんばります！','集中、集中…！'], support:['今日も一緒にがんばろう！','1問ずつ確実にいこう！','肩の力を抜いてね☺'] },

function initBank(){
  let raw = null;
  try{ raw = window.KOKUSHI_BANK || (typeof KOKUSHI_BANK !== 'undefined' ? KOKUSHI_BANK : null); }catch(e){}
  if(!raw || !Array.isArray(raw.questions)){ raw = DEMO_BANK; DEMO = true; }
  const nm = o => o && (o.name || o.title || o.label || o.n || o.code) || '';
  const DOM = {}, SUB = {};
  (raw.kijun || []).forEach(d => {
    const dc = d.code || ((d.subjects?.[0]?.code || d.subjects?.[0]?.units?.[0]?.code || '').split('-')[0]);
    DOM[dc] = { code:dc, name:nm(d) || dc };
    (d.subjects || []).forEach(s => {
      const sc = s.code || ((s.units?.[0]?.code || '').split('-').slice(0,2).join('-'));
      SUB[sc] = { code:sc, name:nm(s) || sc, dom:dc };
    });
  });
  const Q = [];
  raw.questions.forEach(q => {
    if(q.excluded) return;
    const ans = (Array.isArray(q.answer) ? q.answer : [q.answer]).map(Number).filter(n => n >= 1);
    if(!ans.length || !Array.isArray(q.choices) || q.choices.length < 2) return;
    const p = String(q.code || '').split('-');
    const dc = p[0] || '他', sc = p.slice(0,2).join('-') || dc;
    if(!DOM[dc]) DOM[dc] = { code:dc, name:dc };
    if(!SUB[sc]) SUB[sc] = { code:sc, name:sc, dom:dc };
    const m = /^(\d+)([AP])(\d+)/.exec(q.id || '');
    Q.push(Object.assign({}, q, {
      ans, dc, sc,
      src: q.type === 'ai' ? 'ai' : 'past',
      rnd: +(q.round || (m && m[1]) || 0),
      need: (/[2２二]つ選べ/.test(q.stem || '') && ans.length >= 2) ? 2 : 1,
      exp: q.explanation || q.exp || '',
      cexp: q.choiceExplanations || q.ce || null,
      iexp: q.itemExplanations || q.ie || null,
    }));
  });
  BANK = { Q, byId:Object.fromEntries(Q.map(q => [q.id, q])), DOM, SUB,
           rounds:[...new Set(Q.filter(q => q.src==='past' && q.rnd).map(q => q.rnd))].sort((a,b) => a-b) };
}

/* ------------------------- キャラクター：ファイル名から自動振り分け ------------------------- */
let CH = [];
function parseCharacters(){
  CH = CHARACTERS.map((e, i) => {
    const file = typeof e === 'string' ? e : e.file;
    const base = file.replace(/\.[^.]+$/, '').toLowerCase();
    const role = (ROLE_WORDS.find(([, ws]) => ws.some(w => base.includes(w.toLowerCase()))) || [null])[0];
    const toks = base.split(/[_\-\s.]+/), moods = [];
    for(const t of toks) for(const [m, ws] of Object.entries(MOOD_WORDS)) if(ws.includes(t) && !moods.includes(m)) moods.push(m);
    if(!moods.length) moods.push(role === 'teacher' ? 'explain' : 'normal');
    return { file, role, moods, idx:i,
             name:(typeof e === 'object' && e.name) || `${ROLE_JA[role] || '？'}${i+1}`,
             topics:(typeof e === 'object' && e.topics) || [] };
  });
}
const lastPick = {};
function pickChara(role, moods = [], topic = ''){
  const all = CH.filter(c => c.role === role); if(!all.length) return null;
  let pool = all.filter(c => moods.some(m => c.moods.includes(m)));
  if(!pool.length) pool = all;
  if(topic){ const t = pool.filter(c => c.topics.some(k => topic.includes(k))); if(t.length && Math.random() < .75) pool = t; }
  if(pool.length > 1) pool = pool.filter(c => c !== lastPick[role]);
  const c = rnd(pool); lastPick[role] = c; return c;
}
function charaImg(c){
  if(!c) return `<div class="emoji">✨</div>`;
  return `<img src="${esc(CHARA_DIR + c.file)}" alt="${esc(c.name)}" data-role="${c.role}" data-file="${esc(c.file)}" onerror="charaFail(this)">`;
}
/* 画像が見つからないときの再読み込み。
   Mac からアップロードすると「ポ」「ブ」などが「ホ＋゜」のように分かれた文字で保存され、
   GitHub などではファイル名が一致しなくなる。そのため、分かれた書き方（NFD）・まとまった書き方（NFC）の順に試す */
function charaFail(img){
  const f = img.dataset.file || '', tried = +(img.dataset.retry || 0);
  const alts = [f.normalize('NFD'), f.normalize('NFC')].filter(x => x !== f);
  if(tried < alts.length){ img.dataset.retry = tried + 1; img.src = CHARA_DIR + alts[tried]; return; }
  const d = document.createElement('div'); d.className = 'emoji'; d.textContent = ROLE_EMOJI[img.dataset.role] || '✨'; img.replaceWith(d);
}

/* 吹き出し付きで画面下に登場させる */
const Stage = {
  timers:{},
  show(slot, c, text, ms = 3200){
    const el = $('#slot' + slot); if(!el) return;
    el.classList.remove('show'); void el.offsetWidth;
    el.innerHTML = (text ? `<div class="bub">${esc(text)}</div>` : '') + charaImg(c);
    el.classList.add('show');
    clearTimeout(this.timers[slot]);
    if(ms) this.timers[slot] = setTimeout(() => el.classList.remove('show'), ms);
  },
  token:0,
  hide(){ this.token++; ['L','R'].forEach(s => { $('#slot'+s)?.classList.remove('show'); clearTimeout(this.timers[s]); }); }
};
/* 次の操作まで表示し続ける場面（解答後・ヒント・結果画面） */
const STAY_EVENTS = ['correct','combo','recover','wrong','conquer','hint','finishHi','finishMd','finishLo'];
function react(ev, ctx = {}){
  if(!S.prefs.chara) return;
  const token = Stage.token;
  const cast = CAST[ev], lines = LINES[ev] || {}; if(!cast) return;
  const fill = s => s.replace('{n}', ctx.n ?? '').replace('{rate}', ctx.rate ?? '');
  ['L','R'].forEach((slot, k) => {
    if(!cast[slot]) return;
    const [role, moods] = cast[slot];
    const c = pickChara(role, moods, ctx.topic || '');
    const text = lines[role] ? fill(rnd(lines[role])) : '';
    // 解答後の演出は［次の問題］を押すまで表示し続ける（ms=0）。開始時のあいさつなどは数秒で引っ込む
    const ms = ctx.ms ?? (STAY_EVENTS.includes(ev) ? 0 : 3400);
    setTimeout(() => { if(token === Stage.token) Stage.show(slot, c, text, ms); }, k * 180);
  });
}

const SFX = {

      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);

function sparkle(el, n = 14){
  const r = el?.getBoundingClientRect?.() || {left:innerWidth/2, top:innerHeight/2, width:0, height:0};
  const x = r.left + r.width/2, y = r.top + r.height/2;
  for(let i = 0; i < n; i++){
    const s = document.createElement('span'); s.className = 'spark';
    s.textContent = rnd(['✨','⭐','💖','🌟','✦']);
    const a = Math.random()*Math.PI*2, d = 50 + Math.random()*80;
    s.style.left = x + 'px'; s.style.top = y + 'px';
    s.style.setProperty('--dx', Math.cos(a)*d + 'px'); s.style.setProperty('--dy', Math.sin(a)*d + 'px');
    document.body.appendChild(s); setTimeout(() => s.remove(), 950);
  }
}

function tfEligible(q){
  return q.ans.length === 1 && q.need === 1 && !(q.items && q.items.length) && !(q.images && q.images.length)

/* ------------------------- 出題セッション ------------------------- */
let SES = null;
/* 否定形（「〜ないのは」「誤っているのは」など）の問題は、
   「正しい？」ではなく「正解に当たる？」と聞く。○＝正解の選択肢、×＝正解ではない */
function tfKind(stem){
  if(/(誤って|誤り|正しくない|適切でない|不適切|該当しない|含まれない|みられない|ないのはどれか|ないもの)/.test(stem)) return 'neg';
  if(/(正しいのはどれか|適切なのはどれか)/.test(stem)) return 'pos';
  return 'ans';
}
function tfAsk(kind){
  if(kind === 'neg') return 'この記述は、問いの正解に当たる？';
  if(kind === 'pos') return 'この記述は正しい？';
  return 'この選択肢は「正答」？';
}
function makeItem(q, fmt){
  let f = fmt === 'mix' ? (tfEligible(q) && Math.random() < .5 ? 'tf' : 'mc') : fmt;
  if(f === 'tf' && !tfEligible(q)) f = 'mc';
  if(f === 'mc') return { q, fmt:'mc' };
  const a = q.ans[0] - 1, others = q.choices.map((_, i) => i).filter(i => i !== a);
  const ci = Math.random() < .45 ? a : rnd(others), isAns = ci === a, kind = tfKind(q.stem || '');
  /* 聞き方を「正解に当たる？」に統一したので、○＝その選択肢が正答（isAns）で固定 */
  return { q, fmt:'tf', ci, kind, truth: isAns };
}
function startSession(mode){
  const st = getSetup();
  let pool = mode === 'weak' ? Object.keys(S.wrong).map(id => BANK.byId[id]).filter(Boolean) : poolFor(st);
  if(mode === 'weak' && st.fmt === 'tf' && pool.some(tfEligible)) pool = pool.filter(tfEligible);
  if(!pool.length){ alert(mode === 'weak' ? '弱点リストは空です。すばらしい！' : '条件に合う問題がありません。'); return; }
  const qs = shuffle(pool).slice(0, Math.min(st.count, pool.length));
  const fmt = mode === 'weak' && st.fmt === 'tf' && !pool.some(tfEligible) ? 'mc' : st.fmt;
  SES = { mode, st, fmt, items:qs.map(q => makeItem(q, fmt)), i:0, res:[], combo:0, maxCombo:0, prevWrong:false, done:false, t0:Date.now() };
  go('quiz');
  setTimeout(() => react(mode === 'weak' ? 'weak' : 'start'), 250);
}
function renderQuiz(){
  const it = SES.items[SES.i], q = it.q, n = SES.items.length;
  it.answered = false; it.sel = []; it.hint = null;
  const tags = `<span class="badge">${esc(qLabel(q))}</span> <span class="badge dm">${esc(domName(q.dc))}</span>
    ${q.src==='ai'?'<span class="badge ai">AI作成</span>':''} ${q.needsReview?'<span class="badge rv">要確認</span>':''}
    ${SES.mode==='weak'?'<span class="badge rv">弱点克服</span>':''}`;
  const items = q.items && q.items.length ? `<div class="items">${q.items.map(x => `<div><b>${esc(x.k)}.</b> ${br(x.t)}</div>`).join('')}</div>` : '';
  const imgs = (q.images || []).map(s => `<img class="qimg" src="${esc(s)}" alt="問題の図" loading="lazy">`).join('');
  let body;
  if(it.fmt === 'tf'){
    body = `<div class="mute" style="font-weight:700">問：${br(q.stem)}</div>
      <div class="tfcard">「${br(q.choices[it.ci])}」</div>
      <div class="tfask">${tfAsk(it.kind)}</div>
      <div class="tfbtns"><button class="tfbtn o" data-tf="1">〇</button><button class="tfbtn x" data-tf="0">×</button></div>`;
  }else{
    body = `<div class="stem">${br(q.stem)}${q.need===2?' <span class="badge rv">2つ選ぶ</span>':''}</div>${items}${imgs}
      <div class="choices">${q.choices.map((c,i) => `<button class="choice" data-c="${i}"><span class="no">${i+1}</span><span>${br(c)}</span></button>`).join('')}</div>
      <div class="row" style="margin-top:12px">
        ${q.need===2 ? `<button class="btn" id="decide" disabled style="flex:1">これで決定</button>` : ''}
        ${q.need===1 && q.choices.length > 2 ? `<button class="btn ghost" id="hintBtn" style="flex:1">💡 ヒント（1つ消す）</button>` : ''}
      </div>`;
  }
  $('#app').innerHTML = `
    <div class="qtop"><b>${SES.i+1} / ${n}</b><div class="prog"><i style="width:${SES.i/n*100}%"></i></div>
      <span class="combo ${SES.combo>=3?'hot':''}" id="combo">${SES.combo>=2?`🔥${SES.combo}`:''}</span></div>
    <div class="card" id="qcard"><div class="row" style="gap:6px">${tags}</div>${body}</div><div id="fb"></div>`;
  $('#app').onclick = e => {
    const c = e.target.closest('[data-c]'), t = e.target.closest('[data-tf]');
    if(c && !it.answered){
      const i = +c.dataset.c; if(i === it.hint) return; SFX.click();
      if(q.need === 2){
        it.sel = it.sel.includes(i) ? it.sel.filter(x => x !== i) : [...it.sel, i].slice(-2);
        document.querySelectorAll('.choice').forEach(b => b.classList.toggle('sel', it.sel.includes(+b.dataset.c)));
        $('#decide').disabled = it.sel.length !== 2;
      }else{ it.sel = [i]; judge(); }
    }else if(t && !it.answered){ it.sel = [+t.dataset.tf]; judge(); }
    else if(e.target.id === 'decide') judge();
    else if(e.target.id === 'hintBtn' && it.hint == null){
      const wrongs = q.choices.map((_,i) => i).filter(i => !q.ans.includes(i+1));
      it.hint = rnd(wrongs); const el = document.querySelector(`.choice[data-c="${it.hint}"]`); el.classList.add('off');
      e.target.disabled = true; react('hint', { topic:domName(q.dc) + subName(q.sc) });
    }else if(e.target.id === 'next') next();
  };
}
function judge(){
  const it = SES.items[SES.i], q = it.q; it.answered = true;
  let ok;
  if(it.fmt === 'tf') ok = (it.sel[0] === 1) === it.truth;
  else if(q.need === 2) ok = it.sel.length === 2 && it.sel.every(i => q.ans.includes(i+1));
  else ok = q.ans.includes(it.sel[0] + 1);
  // 記録（この端末だけ）
  const a = S.ans[q.id] = S.ans[q.id] || { n:0, c:0 };
  a.n++; if(ok) a.c++; a.last = ok ? 1 : 0; a.t = Date.now();
  let conquered = false;
  if(!ok) S.wrong[q.id] = Date.now();
  else if(SES.mode === 'weak' && S.wrong[q.id]){ delete S.wrong[q.id]; conquered = true; }
  save();
  SES.res.push({ id:q.id, ok, fmt:it.fmt, dc:q.dc, sc:q.sc, hint:it.hint != null });
  // 見た目
  if(it.fmt === 'tf'){
    document.querySelectorAll('.tfbtn').forEach(b => { b.disabled = true; const v = +b.dataset.tf === 1;
      if(v === it.truth) b.classList.add('ok'); else if(+b.dataset.tf === it.sel[0]) b.classList.add('ng'); });
  }else{
    document.querySelectorAll('.choice').forEach(b => { const i = +b.dataset.c; b.disabled = true;
      if(q.ans.includes(i+1)) b.classList.add('ok'); else if(it.sel.includes(i)) b.classList.add('ng'); });
    $('#hintBtn') && ($('#hintBtn').disabled = true);
  }
  const topic = domName(q.dc) + subName(q.sc);
  if(ok){
    SES.combo++; SES.maxCombo = Math.max(SES.maxCombo, SES.combo);
    anim($('#qcard'), 'pop'); sparkle(document.querySelector('.choice.ok,.tfbtn.ok') || $('#qcard'), SES.combo >= 3 ? 22 : 14);
    if(COMBO_SHOW.includes(SES.combo)){ SFX.combo(); react('combo', { n:SES.combo, topic }); }
    else { SFX.ok(); react(conquered ? 'conquer' : SES.prevWrong ? 'recover' : 'correct', { topic }); }
  }else{
    SES.combo = 0; SFX.ng(); anim($('#qcard'), 'shake'); react('wrong', { topic });
  }
  SES.prevWrong = !ok;
  const cb = $('#combo'); cb.textContent = SES.combo >= 2 ? `🔥${SES.combo}` : ''; cb.classList.toggle('hot', SES.combo >= 3);
  renderFeedback(it, ok, conquered);
}
/* 解説欄のラベル：「未監修」は表示しない（例：「AI作成・未監修」→「AI作成」） */
function reviewLabel(q){ return String(q.review || '').replace(/[・\s]*未監修/g, '').trim(); }
function renderFeedback(it, ok, conquered){
  const q = it.q, t = pickChara('teacher', ['explain'], domName(q.dc) + subName(q.sc));
  const ansTxt = q.ans.join('・');
  let verdict = ok ? `⭕ 正解！${conquered ? '　弱点克服🎉' : ''}` : '❌ 不正解…';

    const ansPart = `この問題の正答は ${ansTxt} 「${esc(q.choices[q.ans[0]-1])}」`;

      ${q.ref ? `<div class="mute" style="margin-top:6px">📖 参照：${esc(q.ref)}</div>` : ''}
      ${q.note ? `<div class="mute" style="margin-top:4px">📝 ${esc(q.note)}</div>` : ''}

    <button class="btn big" id="next" style="margin-top:12px">${last ? '結果を見る 🏁' : '次の問題 ▶'}</button></div>`;
  setTimeout(() => $('#fb')?.scrollIntoView({ behavior:'smooth', block:'nearest' }), 120);
}
function next(){

function finish(){
  SES.done = true;
  const n = SES.res.length, c = SES.res.filter(r => r.ok).length, byDom = {}, bySub = {};
  SES.res.forEach(r => { (byDom[r.dc] = byDom[r.dc] || [0,0])[1]++; if(r.ok) byDom[r.dc][0]++;

  SES.summary = { t:Date.now(), n, c, rate:pct(c,n), mode:SES.mode, fmt:SES.fmt, src:SES.st.src, maxCombo:SES.maxCombo,

    <p class="mute" style="margin-top:0">送信ボタンを押したときだけ、下の「送信内容」が教員のGoogleフォームに届きます。それ以外の学習記録はこの端末から外に出ません。</p>
    ${configured ? `<div class="notice">🏫 提出先：<b>${esc(FORM_CONFIG.schoolName || '（学校名未設定）')}</b> の担当教員のフォーム</div>`
      : '<div class="notice">⚙ 提出先がまだ設定されていません。担当の先生に確認してください（school.js が必要です）。</div>'}
    <div class="row"><label class="field">学籍番号<input id="sid" value="${esc(S.student.id||'')}" inputmode="numeric" autocomplete="off"></label>
      <label class="field">氏名<input id="sname" value="${esc(S.student.name||'')}" autocomplete="off"></label></div>
    <label class="row" style="margin:10px 0;font-size:.85rem;font-weight:700"><input type="checkbox" id="remember" ${S.student.id?'checked':''}> この端末に学籍番号・氏名を記憶する</label>
    <details class="more"><summary>送信内容を確認</summary><pre class="preview" id="pv"></pre></details>
    <button class="btn big" id="send" style="margin-top:12px" ${configured ? '' : 'disabled'}>${FORM_CONFIG.sendMode==='direct'?'📨 教員に送信する':'📨 提出フォームを開く'}</button>
    <div class="mute" id="sendMsg" style="margin-top:8px;text-align:center"></div></div>` : ''}`;
  $('#again').onclick = () => startSession(sm.mode === 'weak' ? 'weak' : 'normal');
  $('#weak').onclick = () => startSession('weak');
  if(!FORM_CONFIG.enabled) return;
  const upd = () => { const { vals } = formPayload(sm, $('#sid').value.trim(), $('#sname').value.trim());
    $('#pv').textContent = Object.entries(vals).filter(([k]) => FORM_CONFIG.fields[k]).map(([k,v]) => `${k}: ${v}`).join('\n'); };
  $('#sid').oninput = $('#sname').oninput = upd; upd();
  $('#send').onclick = async () => {
    if(!FORM_READY){ alert('提出先が設定されていません'); return; }
    const sid = $('#sid').value.trim(), name = $('#sname').value.trim();
    if(!sid || !name){ alert('学籍番号と氏名を入力してください'); return; }
    if(!navigator.onLine){ $('#sendMsg').textContent = '今は通信できません。電波のある場所で、「成績」→「テスト履歴」の［提出］から後で提出できます。'; return; }
    S.student = $('#remember').checked ? { id:sid, name } : {}; save();
    const { p } = formPayload(sm, sid, name);
    if(FORM_CONFIG.sendMode === 'direct'){
      try{
        await fetch(FORM_CONFIG.viewUrl.replace(/\/viewform.*$/, '/formResponse'), { method:'POST', mode:'no-cors', body:p });
        $('#sendMsg').textContent = '送信しました（念のため、届いたか先生に確認してください）'; SFX.ok(); sparkle($('#send'));
      }catch(e){ $('#sendMsg').textContent = '送信できませんでした。通信状況を確認してください。'; }
    }else{
      window.open(FORM_CONFIG.viewUrl + (FORM_CONFIG.viewUrl.includes('?') ? '&' : '?') + 'usp=pp_url&' + p.toString(), '_blank', 'noopener');
      $('#sendMsg').textContent = '開いたフォームの一番下にある［送信］を押すと提出完了です。';
    }
  };
}
function barRow(label, c, n){
  const r = pct(c, n), col = r >= 80 ? 'var(--mint)' : r >= 60 ? 'var(--yellow)' : 'var(--red)';
  return `<div class="drow"><div class="row" style="justify-content:space-between"><span>${esc(label)}</span><b>${c}/${n}（${r}%）</b></div>
    <div class="bar"><i style="width:${r}%;background:${col}"></i></div></div>`;
}

/* ------------------------- 成績ダッシュボード ------------------------- */
function renderStats(){
  const D = {}, Sb = {}, tot = {};
  BANK.Q.forEach(q => { tot[q.dc] = (tot[q.dc]||0) + 1; const a = S.ans[q.id]; if(!a) return;
    const d = D[q.dc] = D[q.dc] || { n:0, c:0, u:0 }; d.n += a.n; d.c += a.c; d.u++;
    const s = Sb[q.sc] = Sb[q.sc] || { n:0, c:0, u:0, dom:q.dc }; s.n += a.n; s.c += a.c; s.u++; });
  const t = totals();
  const weakest = Object.entries(Sb).filter(([,s]) => s.n >= 3).sort((a,b) => a[1].c/a[1].n - b[1].c/b[1].n).slice(0, 5);
  $('#app').innerHTML = `
  <div class="grid2" style="margin-bottom:16px">
    <div class="stat"><b>${t.n ? pct(t.c,t.n) : '-'}%</b><span>累計正答率</span></div>
    <div class="stat"><b>${t.uniq.toLocaleString()}</b><span>解いた問題（/${BANK.Q.length.toLocaleString()}）</span></div>
    <div class="stat"><b>${t.n.toLocaleString()}</b><span>累計解答数</span></div>
    <div class="stat"><b style="color:var(--red)">${t.wrong}</b><span>弱点リスト</span></div></div>
  ${weakest.length ? `<div class="card"><h2>🎯 苦手な科目 TOP5</h2>${weakest.map(([k,s]) => barRow(subName(k), s.c, s.n)).join('')}</div>` : ''}
  <div class="card"><h2>📊 大項目別（タップで科目別）</h2>
    ${Object.values(BANK.DOM).map(d => { const x = D[d.code] || { n:0, c:0, u:0 };
      return `<details class="dom"><summary style="display:block">${barRow(`${d.code} ${d.name}`, x.c, x.n)}
        <div class="mute">解いた問題 ${x.u}/${tot[d.code]||0}</div></summary><div class="subs">
        ${Object.entries(Sb).filter(([,s]) => s.dom === d.code).map(([k,s]) => barRow(subName(k), s.c, s.n)).join('') || '<span class="mute">まだ解いていません</span>'}</div></details>`; }).join('')}</div>
  <div class="card"><h2>🗓 テスト履歴</h2>${S.hist.length ? `<div style="overflow-x:auto"><table><tr><th>日時</th><th>形式</th><th>得点</th><th>正答率</th><th></th></tr>
    ${S.hist.slice(0,30).map((h,i) => `<tr><td>${fmtDate(h.t)}</td><td>${h.mode==='weak'?'🔥':''}${FMT_JA[h.fmt]||''}</td><td>${h.c}/${h.n}</td><td><b>${h.rate}%</b></td><td><button class="chip" data-h="${i}">提出</button></td></tr>`).join('')}</table></div>
    <p class="mute">［提出］を押すと、そのテストの結果を後から先生に提出できます（圏外で提出できなかったときなど）。</p>`
    : '<span class="mute">まだ履歴がありません</span>'}</div>`;
  document.querySelectorAll('[data-h]').forEach(b => b.onclick = () => {
    const h = S.hist[+b.dataset.h]; if(!h) return; SES = { summary:h, done:true, replay:true }; go('result'); });
}

/* ------------------------- 設定 ------------------------- */
function renderSettings(){
  const bad = CH.filter(c => !c.role);
  const count = r => CH.filter(c => c.role === r).length;
  $('#app').innerHTML = `
  <div class="card"><h2>⚙ 表示と音</h2>
    <label class="row" style="font-weight:700;margin-bottom:8px"><input type="checkbox" id="pSound" ${S.prefs.sound?'checked':''}> 効果音を鳴らす</label>
    <label class="row" style="font-weight:700"><input type="checkbox" id="pChara" ${S.prefs.chara?'checked':''}> キャラクターの演出を表示する</label></div>
  <div class="card"><h2>🧸 キャラクター確認</h2>
    <p class="mute" style="margin-top:0">ファイル名から読み取った役割と状態です。画像が表示されない場合は、chara フォルダとファイル名を確認してください。</p>
    <div class="row" style="gap:6px;margin-bottom:10px">${Object.keys(ROLE_JA).map(r => `<span class="badge">${ROLE_JA[r]} ${count(r)}</span>`).join('')}
      ${bad.length ? `<span class="badge rv">役割不明 ${bad.length}</span>` : ''}</div>
    <div class="gal">${CH.map(c => `<div class="g ${c.role?'':'err'}">${charaImg(c)}<b>${esc(c.name)}</b><br>
      ${c.role ? ROLE_JA[c.role] : '<span style="color:var(--red)">役割不明</span>'}<br><span class="mute">${c.moods.join(', ')}${c.topics.length?'<br>得意:'+esc(c.topics.join('・')):''}</span><br>
      <span class="mute" style="word-break:break-all">${esc(c.file)}</span></div>`).join('')}</div>
    <div class="row" style="margin-top:12px">${Object.keys(CAST).map(ev => `<button class="chip" data-ev="${ev}">${ev}</button>`).join('')}</div>
    <p class="mute">↑ 押すと、その場面の登場演出を試せます。</p></div>
  <div class="card"><h2>💾 学習データ（この端末のみ）</h2>
    <div class="row"><button class="btn ghost" id="exp">📤 ファイルに書き出す</button>
      <label class="btn ghost">📥 ファイルから読み込む<input type="file" id="imp" accept=".json,application/json,text/plain" hidden></label>
      <button class="btn ghost" id="clrW">弱点リストを空にする</button>
      <button class="btn ghost" style="color:var(--red)" id="reset">全データ削除</button></div>
    <p class="mute">機種変更や別のブラウザへ移るときは「書き出す」→ 新しい端末で「読み込む」で引き継げます。</p>
    <details class="more"><summary>ファイルが使いにくいとき（コピー＆貼り付けで引き継ぐ）</summary>
      <p class="mute">① 元の端末で［コードをコピー］→ LINEのメモやメールなどに貼って自分に送る。② 新しい端末でそのコードをコピーし、下の枠に貼って［このコードで読み込む］。</p>
      <div class="row"><button class="btn ghost" id="cpy">📋 コードをコピー</button></div>
      <textarea class="code" id="codeIn" placeholder="ここにコードを貼り付け"></textarea>
      <div class="row" style="margin-top:6px"><button class="btn ghost" id="codeLoad">このコードで読み込む</button></div></details></div>
  <div class="card"><h2>📱 アプリについて</h2>
    <p class="mute" style="margin:0">バージョン ${APP_VER}　／　${isStandalone() ? 'ホーム画面のアイコンから起動中' : 'ブラウザで表示中'}${navigator.serviceWorker && navigator.serviceWorker.controller ? '　／　オフライン対応済み' : ''}<br>
    結果の提出先：${FORM_READY ? esc(FORM_CONFIG.schoolName || '設定済み') : '未設定'}</p>
    <button class="btn ghost" id="showInst" style="margin-top:10px">ホーム画面に追加する方法を見る</button></div>`;
  $('#pSound').onchange = e => { S.prefs.sound = e.target.checked; save(); paintMute(); };
  $('#pChara').onchange = e => { S.prefs.chara = e.target.checked; save(); };
  document.querySelectorAll('[data-ev]').forEach(b => b.onclick = () => react(b.dataset.ev, { n:5, rate:85 }));
  $('#exp').onclick = async () => {
    const name = `st-trainer-${new Date().toISOString().slice(0,10)}.json`, text = JSON.stringify(S);
    try{ const file = new File([text], name, { type:'application/json' });
      if(navigator.canShare && navigator.canShare({ files:[file] })){ await navigator.share({ files:[file], title:'ST国試トレーナー 学習データ' }); return; }
    }catch(e){ if(e && e.name === 'AbortError') return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type:'application/json' })); a.download = name; a.click(); };
  const importText = t => { try{ const d = JSON.parse(String(t).trim()); if(!d || !d.ans) throw 0;
      if(!confirm('この端末の学習データを、読み込むデータで置き換えます。よろしいですか？')) return;
      S = Object.assign(S, d); save(); alert('読み込みました'); go('stats'); }catch(x){ alert('データの形式が違います'); } };
  $('#imp').onchange = e => { const f = e.target.files[0]; if(!f) return; const r = new FileReader(); r.onload = () => importText(r.result); r.readAsText(f); };
  $('#cpy').onclick = async () => { const t = JSON.stringify(S);
    try{ await navigator.clipboard.writeText(t); $('#cpy').textContent = '✅ コピーしました'; }
    catch(e){ $('#codeIn').value = t; $('#codeIn').select(); alert('自動コピーできませんでした。枠の中のコードを長押しして「すべてを選択」→「コピー」してください。'); } };
  $('#codeLoad').onclick = () => importText($('#codeIn').value);
  $('#showInst').onclick = () => { S.prefs.hideInstall = false; save(); go('home'); };
  $('#clrW').onclick = () => { if(confirm('弱点リストを空にしますか？')){ S.wrong = {}; save(); alert('空にしました'); } };
  $('#reset').onclick = () => { if(confirm('この端末の成績・履歴をすべて削除します。よろしいですか？')){
    S = { ans:{}, wrong:{}, hist:[], prefs:S.prefs, setup:null, student:{} }; save(); go('home'); } };
}

/* ------------------------- スマホ対応（ホーム画面追加・オフライン） ------------------------- */
const APP_VER = '3.2（2026-10-22）';
function isStandalone(){ return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true; }
const IS_IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const IS_MOBILE = IS_IOS || /Android|Mobile/.test(navigator.userAgent);
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if(view === 'home') go('home'); });
window.addEventListener('appinstalled', () => { installEvt = null; if(view === 'home') go('home'); });
function installCard(){
  if(isStandalone() || !IS_MOBILE || S.prefs.hideInstall) return '';
  const body = IS_IOS
    ? `<ol><li>Safari の画面下にある <b>共有ボタン</b>（四角から↑が出ているマーク）を押す</li>
         <li><b>「ホーム画面に追加」</b>を押す（見つからなければ下にスクロール）</li><li>右上の<b>「追加」</b>を押す</li></ol>
       <b>⚠ iPhoneでは、ブラウザで解いた記録はホーム画面のアイコン側に引き継がれません。</b>これからはアイコンから開いてください（記録を移すときは「設定」→「学習データ」）。`
    : installEvt ? `<button class="btn mint" id="doInstall" style="width:100%">📲 ホーム画面に追加する</button>`
    : `<ol><li>Chrome の右上の <b>︙</b>（縦の点3つ）を押す</li><li><b>「ホーム画面に追加」</b>または<b>「アプリをインストール」</b>を押す</li><li><b>「追加」</b>（または「インストール」）を押す</li></ol>`;
  return `<div class="install"><button class="x" id="hideInst">閉じる</button><h3>📲 ホーム画面に追加すると、アプリのように使えます</h3>${body}
    <div class="mute">一度開いたあとは、電波がない場所でも問題を解けます。</div></div>`;
}
function bindInstallCard(){
  const h = $('#hideInst'); if(h) h.onclick = () => { S.prefs.hideInstall = true; save(); go('home'); };
  const d = $('#doInstall'); if(d) d.onclick = async () => { if(!installEvt) return; installEvt.prompt(); try{ await installEvt.userChoice; }catch(e){} installEvt = null; go('home'); };
}
function paintNet(){ document.body.classList.toggle('offline', !navigator.onLine); }
window.addEventListener('online', paintNet); window.addEventListener('offline', paintNet);
if(/^https?:$/.test(location.protocol) && 'serviceWorker' in navigator){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(e => console.info('オフライン機能を開始できませんでした', e)));
}
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}

/* ------------------------- 起動 ------------------------- */
initBank(); parseCharacters(); paintMute(); paintNet(); go('home');
</script>
